<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albert Luppol</title>
<style>
  :root { color-scheme: light dark; --fg: #16181d; --bg: #ffffff; --muted: #5b6472; --line: #e4e7ec; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e9ecf2; --bg: #0f1115; --muted: #98a1b0; --line: #262b33; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         display: grid; place-items: center; min-height: 100vh; padding: 2rem; }
  main { max-width: 34rem; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  p.role { color: var(--muted); margin: 0 0 2rem; }
  nav { display: flex; gap: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Albert Luppol</h1>
  <p class="role">Software engineer — Milwaukee, WI</p>
  <p>Projects are being moved here one at a time.</p>
  <nav>
    <a href="https://github.com/aluppol">GitHub</a>
    <a href="https://www.linkedin.com/in/aluppol">LinkedIn</a>
  </nav>
</main>
</body>
</html>
